<script>
function svgToPngDataUrl() {
  return new Promise(function (resolve) {
    var svg = document.getElementById('src');
    var xml = new XMLSerializer().serializeToString(svg);
    var svg64 = btoa(unescape(encodeURIComponent(xml)));
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 500;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 1024, 500);
      resolve(canvas.toDataURL('image/png').split(',')[1]);
    };
    img.src = 'data:image/svg+xml;base64,' + svg64;
  });
}
window.getFeatureGraphicBase64 = svgToPngDataUrl;
</script>
